<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Dispatch</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Glyph sprite. 24-unit grid at AIcss's weights (1.6 for the state circles,
       1.5 for UI chrome, 1.8 for the chevron) so every icon in the panel is drawn
       on the same skeleton as the components it is ported from. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <g id="i-circle-check" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
      </g>
      <g id="i-circle-arrow" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="m12.75 15 3-3m0 0-3-3m3 3h-7.5M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
      </g>
      <g id="i-circle-dashed" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <circle cx="12" cy="12" r="9" stroke-dasharray="1.8 3.6" />
      </g>
      <g id="i-circle-alert" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 8.1v4.4M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0ZM12 15.6h.008v.008H12v-.008Z" />
      </g>
      <g id="i-circle-reply" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
        <path d="M11.4 8.9 8.6 11.7l2.8 2.8M8.6 11.7h4.6a2.5 2.5 0 0 1 2.5 2.5v.9" />
      </g>
      <g id="i-check-filled">
        <path fill-rule="evenodd" clip-rule="evenodd" d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12Zm13.36-1.814a.75.75 0 1 0-1.22-.872l-3.236 4.53L9.53 12.22a.75.75 0 0 0-1.06 1.06l2.25 2.25a.75.75 0 0 0 1.14-.094l3.75-5.25Z" fill="currentColor" />
      </g>
      <g id="i-list" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8.25 6.75h12M8.25 12h12m-12 5.25h12M3.75 6.75h.007v.008H3.75V6.75Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0ZM3.75 12h.007v.008H3.75V12Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm-.375 5.25h.007v.008H3.75v-.008Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
      </g>
      <g id="i-chevron" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="m19.5 8.25-7.5 7.5-7.5-7.5" />
      </g>
      <g id="i-arrow-up" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 19V5M5 12l7-7 7 7" />
      </g>
      <g id="i-x" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 6 6 18M6 6l12 12" />
      </g>
      <g id="i-branch" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 3v12M18 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM6 21a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM18 9a9 9 0 0 1-9 9" />
      </g>
      <g id="i-folder" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2.25 12.75V6.75A1.5 1.5 0 0 1 3.75 5.25h4.19a1.5 1.5 0 0 1 1.06.44l1.06 1.06a1.5 1.5 0 0 0 1.06.44h9.13a1.5 1.5 0 0 1 1.5 1.5v3.06M2.25 12.75h19.5M2.25 12.75v4.5a1.5 1.5 0 0 0 1.5 1.5h16.5a1.5 1.5 0 0 0 1.5-1.5v-4.5" />
      </g>
      <g id="i-code" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="m8 6-6 6 6 6M16 6l6 6-6 6" />
      </g>
      <g id="i-copy" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="11" height="11" rx="2.5" />
        <path d="M5 15a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2" />
      </g>
      <g id="i-copied" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m4.5 12.75 6 6 9-13.5" />
      </g>
      <g id="i-beaker" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9.75 3.1v5.72a2.25 2.25 0 0 1-.66 1.59L5 14.5m4.75-11.4a24.3 24.3 0 0 1 4.5 0m0 0v5.72c0 .6.24 1.17.66 1.59L19.8 15.3M5 14.5l.77-.19A9.06 9.06 0 0 1 12 15a9.06 9.06 0 0 0 6.23.69l1.57-.39m0 0 1.4 1.4c1.24 1.24.66 3.32-1.06 3.62A48.3 48.3 0 0 1 12 21c-2.77 0-5.49-.24-8.13-.69-1.72-.29-2.3-2.38-1.07-3.61L5 14.5" />
      </g>
    </defs>
  </svg>

  <header>
    <h1>Dispatch</h1>
    <span id="workspace"></span>
    <button id="selftest" class="iconBtn ghost" title="Prove the spawn path" aria-label="Prove the spawn path">
      <svg viewBox="0 0 24 24"><use href="#i-beaker" /></svg>
    </button>
  </header>

  <!-- the board is the page -->
  <main id="board">
    <div id="board-head" hidden>
      <span class="headIcon">
        <svg class="headGlyph on" id="head-list" viewBox="0 0 24 24"><use href="#i-list" /></svg>
        <svg class="headGlyph headCheck" id="head-check" viewBox="0 0 24 24"><use href="#i-check-filled" /></svg>
      </span>
      <span class="headTitle">Agents</span>
      <span class="headCount" id="board-count"></span>
    </div>
    <ul id="cards"></ul>
    <p id="empty">Nothing running.<span>Type a thought below.</span></p>
  </main>

  <!-- one card. stages morph inside it; it never moves. -->
  <div id="composer">
    <div class="frame" id="frame" data-stage="thought">
      <div class="rail">
        <div class="railInner">
          <div class="railRow">
            <span class="railStep" data-step="thought">Thought</span>
            <span class="railSep"></span>
            <!-- "Plan", not "Questions": the router often asks nothing and this
                 stage still carries the target, the profile and the assumptions -->
            <span class="railStep" data-step="questions">Plan</span>
            <span class="railSep"></span>
            <span class="railStep" data-step="review">Spec</span>
          </div>
        </div>
      </div>

      <div class="stages">
        <section class="stage on" id="stage-thought">
          <div class="stageInner">
            <div class="stagePad">
              <textarea id="thought" class="field" rows="1" placeholder="Rough thought…"></textarea>
            </div>
          </div>
        </section>

        <section class="stage" id="stage-questions">
          <div class="stageInner">
            <div class="stagePad">
              <div class="targetRow">
                <span class="chip" id="targetChip">
                  <span class="chipIcon"><svg viewBox="0 0 24 24"><use href="#i-folder" /></svg></span>
                  <input id="target" class="chipInput mono" spellcheck="false" aria-label="Target directory" />
                </span>
                <span class="skillPill" id="profile" hidden></span>
                <!-- only when the thought asked for one; silence here is what
                     let a requested model get dropped without anyone noticing -->
                <span class="skillPill neutral" id="runWith" hidden></span>
              </div>
              <ul id="assumptions" class="notes"></ul>
              <div id="qlist"></div>
            </div>
          </div>
        </section>

        <section class="stage" id="stage-review">
          <div class="stageInner">
            <div class="cb">
              <div class="cbHead">
                <span class="cbFile">
                  <svg class="cbIcon" viewBox="0 0 24 24"><use href="#i-code" /></svg>
                  <span class="cbLang" id="specName">spec.md</span>
                </span>
                <button class="cbCopy" id="copySpec" type="button" aria-label="Copy spec">
                  <svg viewBox="0 0 24 24"><use href="#i-copy" /></svg>
                  <span>Copy</span>
                </button>
              </div>
              <div class="cbBody">
                <textarea id="spec" class="field mono" rows="12" spellcheck="false" aria-label="Spec"></textarea>
              </div>
            </div>
          </div>
        </section>
      </div>

      <div class="barRow">
        <button id="back" class="pill" type="button" hidden><span class="pillLabel">Abort</span></button>
        <span id="status"></span>
        <span class="right">
          <button id="primary-wide" class="pill primary" type="button" hidden><span class="pillLabel">Write spec</span></button>
          <!-- AIcss Orbs, Lattice S3 ("Working"): a comet runs the perimeter of a
               3x3 grid. Sits in the send button's slot while a blocking call runs. -->
          <span class="iconBtn orbBtn" id="orb" aria-label="Working" hidden>
            <span class="orbGlyph">
              <span class="lattice">
                <span class="cell" style="left:0px;top:0px;animation-delay:0ms"></span>
                <span class="cell" style="left:6px;top:0px;animation-delay:-1487.5ms"></span>
                <span class="cell" style="left:12px;top:0px;animation-delay:-1275ms"></span>
                <span class="cell" style="left:0px;top:6px;animation-delay:-212.5ms"></span>
                <span class="cell" data-still data-mid style="left:6px;top:6px"></span>
                <span class="cell" style="left:12px;top:6px;animation-delay:-1062.5ms"></span>
                <span class="cell" style="left:0px;top:12px;animation-delay:-425ms"></span>
                <span class="cell" style="left:6px;top:12px;animation-delay:-637.5ms"></span>
                <span class="cell" style="left:12px;top:12px;animation-delay:-850ms"></span>
              </span>
            </span>
          </span>
          <button id="primary" class="iconBtn send" type="button" title="Dispatch (⌘⏎)" aria-label="Dispatch" disabled>
            <svg viewBox="0 0 24 24"><use href="#i-arrow-up" /></svg>
          </button>
        </span>
      </div>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
